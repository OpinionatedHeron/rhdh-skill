[project]
name = "rhdh-common"
version = "0.1.0"
description = "Shared runtime for RHDH skill scripts: output formatting, subprocess, tool discovery"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"

# Stdlib only (ADR-0002). The openshift_release.yaml module is the single
# exception and is gated behind the optional "yaml" extra.

[project.optional-dependencies]
yaml = ["ruamel.yaml"]

[tool.setuptools.packages.find]
include = ["rhdh_common", "rhdh_common.*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
